<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Site Siege</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h3>Site Siege</h3>
  <div id="stats">
    <div class="stat-row"><span>Imagini:</span><span id="img-count">0</span></div>
    <div class="stat-row"><span>Linkuri:</span><span id="link-count">0</span></div>
    <div class="stat-row"><span>Butoane:</span><span id="btn-count">0</span></div>
    <div class="stat-row"><span>HP Total:</span><span id="total-hp">0</span></div>
    <div class="stat-row"><span>Scor:</span><span id="score-val">0</span></div>
  </div>
  <button id="scan-btn">Scanează Pagina</button>
  <button id="destroy-btn">Activează Distrugerea</button>
  <button id="restore-btn">Restaurează Pagina</button>

  <script src="popup.js"></script>
</body>
</html>
